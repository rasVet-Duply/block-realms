name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_DIR: apps/3d-block-puzzle-premium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
              packages: 'platform-tools'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build web game
        working-directory: ${{ env.APP_DIR }}
        run: npx vite build

      - name: Add Capacitor
        run: npm install --no-save --no-audit --no-fund --ignore-scripts @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 -w ${{ env.APP_DIR }}

      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
          # portrait + fullscreen game feel
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BlockRealms3D-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
